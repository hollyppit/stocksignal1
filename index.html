<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — AI 주식 분석</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1520;
    --surface2: #111d2e;
    --border: #1a2d45;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --accent3: #ff6b35;
    --warn: #ffd166;
    --text: #c8dff0;
    --text-dim: #5a7a99;
    --text-bright: #e8f4ff;
    --red: #ff4d6d;
    --green: #00ff88;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
    --kr: 'Noto Sans KR', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--kr);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
    top: -200px; left: -200px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb2 {
    position: fixed;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,255,136,0.04) 0%, transparent 70%);
    bottom: -200px; right: -100px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Header */
  header {
    padding: 36px 0 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 44px; height: 44px;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-mark::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: var(--accent);
    opacity: 0.15;
  }
  .logo-mark svg { z-index: 1; }

  .logo-text {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--text-bright);
  }
  .logo-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-top: 2px;
  }

  .header-badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    padding: 4px 10px;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
  }
  .input-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .query-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: var(--kr);
    font-size: 15px;
    padding: 14px 16px;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
    min-height: 100px;
  }
  .query-input::placeholder { color: var(--text-dim); font-size: 13px; }
  .query-input:focus { border-color: var(--accent); }

  /* Filter pills */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
  }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    user-select: none;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill.active-green {
    background: rgba(0,255,136,0.08);
    border-color: var(--accent2);
    color: var(--accent2);
  }

  /* Analyze button */
  .analyze-btn {
    width: 100%;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,255,136,0.08));
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }
  .analyze-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(0,255,136,0.15));
    box-shadow: 0 0 30px rgba(0,212,255,0.2);
  }
  .analyze-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Progress */
  .progress-section {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px 28px;
    margin-bottom: 24px;
  }

  .progress-steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    transition: color 0.3s;
  }
  .step.active { color: var(--accent); }
  .step.done { color: var(--accent2); }

  .step-dot {
    width: 8px; height: 8px;
    border: 1px solid currentColor;
    flex-shrink: 0;
    position: relative;
  }
  .step.active .step-dot::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: var(--accent);
    animation: blink 0.8s infinite;
  }
  .step.done .step-dot {
    background: var(--accent2);
    border-color: var(--accent2);
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Result section */
  .result-section {
    display: none;
  }

  /* Score card */
  .score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .score-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
  }
  .score-card.bull::after { background: var(--green); }
  .score-card.bear::after { background: var(--red); }
  .score-card.neutral::after { background: var(--warn); }

  .score-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .score-value {
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }
  .score-card.bull .score-value { color: var(--green); }
  .score-card.bear .score-value { color: var(--red); }
  .score-card.neutral .score-value { color: var(--warn); }

  .score-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Main result box */
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 16px;
    position: relative;
  }
  .result-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .result-box.main::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .result-box.warn::before { background: var(--warn); }
  .result-box.danger::before { background: var(--red); }

  .result-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .result-content {
    font-size: 14px;
    line-height: 1.85;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* Ticker highlight */
  .ticker {
    font-family: var(--mono);
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    color: var(--accent);
    padding: 1px 6px;
    font-size: 12px;
  }

  /* Disclaimer */
  .disclaimer {
    margin-top: 24px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* Fade in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp 0.4s ease forwards; }

  /* Stream cursor */
  .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--accent);
    animation: blink 0.8s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  /* Separator */
  .sep {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }
</style>
</head>
<body>
<div class="glow-orb2"></div>

<div class="container">
  <header>
    <div class="logo-mark">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <polyline points="2,14 6,8 10,11 14,5 18,7" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
        <circle cx="18" cy="7" r="2" fill="#00d4ff"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">SIGNAL</div>
      <div class="logo-sub">AI MARKET INTELLIGENCE</div>
    </div>
    <div class="header-badge">NASDAQ / S&P500</div>
  </header>

  <div class="input-section">
    <div class="section-label">// 분석 요청</div>
    <textarea class="query-input" id="queryInput" placeholder="예시: &quot;반도체 섹터에서 지금 가장 매력적인 종목 추천해줘&quot;&#10;&quot;엔비디아 지금 들어가도 돼?&quot;&#10;&quot;AI 관련주 중 장기투자 가능한 종목 3개 골라줘&quot;&#10;&quot;무역전쟁 리스크 고려해서 방어적인 포트폴리오 짜줘&quot;" rows="4"></textarea>

    <div class="filter-row">
      <span class="pill active" id="pill-both" onclick="setPill('both')">전략 자동선택</span>
      <span class="pill" id="pill-long" onclick="setPill('long')">장기투자</span>
      <span class="pill" id="pill-swing" onclick="setPill('swing')">스윙/단타</span>
    </div>

    <div class="filter-row">
      <span class="pill active-green" id="pill-geo" onclick="togglePill('geo')">지정학 리스크</span>
      <span class="pill active-green" id="pill-macro" onclick="togglePill('macro')">거시경제</span>
      <span class="pill active-green" id="pill-fundamental" onclick="togglePill('fundamental')">펀더멘탈</span>
      <span class="pill active-green" id="pill-sentiment" onclick="togglePill('sentiment')">시장 센티먼트</span>
      <span class="pill active-green" id="pill-technical" onclick="togglePill('technical')">기술적 분석</span>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="startAnalysis()">
      ▶ SIGNAL 분석 시작
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-section" id="progressSection">
    <div class="section-label">// 분석 진행중</div>
    <div class="progress-steps" id="progressSteps">
      <div class="step" id="step1"><div class="step-dot"></div><span>최신 시장 뉴스 및 데이터 수집</span></div>
      <div class="step" id="step2"><div class="step-dot"></div><span>지정학·매크로 리스크 평가</span></div>
      <div class="step" id="step3"><div class="step-dot"></div><span>섹터 및 종목 펀더멘탈 분석</span></div>
      <div class="step" id="step4"><div class="step-dot"></div><span>기술적 지표 및 센티먼트 검토</span></div>
      <div class="step" id="step5"><div class="step-dot"></div><span>매수 타이밍 및 전략 종합</span></div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-section" id="resultSection">
    <div class="score-grid" id="scoreGrid"></div>
    <div class="result-box main" id="mainResult">
      <div class="result-title">종합 분석 결과</div>
      <div class="result-content" id="mainResultContent"></div>
    </div>
    <div class="disclaimer">
      ⚠ 본 분석은 AI가 공개된 정보를 기반으로 생성한 참고자료입니다. 투자 결정은 반드시 본인의 판단과 책임 하에 이루어져야 하며, 이 내용은 투자 권유가 아닙니다.
    </div>
  </div>
</div>

<script>
const ANTHROPIC_API = "https://api.anthropic.com/v1/messages";

let selectedStyle = 'both';
let activeFactors = new Set(['geo','macro','fundamental','sentiment','technical']);

function setPill(style) {
  selectedStyle = style;
  ['both','long','swing'].forEach(s => {
    document.getElementById('pill-' + s).className = 'pill' + (s === style ? ' active' : '');
  });
}

function togglePill(factor) {
  const el = document.getElementById('pill-' + factor);
  if (activeFactors.has(factor)) {
    activeFactors.delete(factor);
    el.className = 'pill';
  } else {
    activeFactors.add(factor);
    el.className = 'pill active-green';
  }
}

function setStep(stepNum, status) {
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('step' + i);
    el.className = 'step' + (i < stepNum ? ' done' : i === stepNum ? ' active' : '');
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startAnalysis() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query) {
    alert('분석할 내용을 입력해주세요.');
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '분석 중...';

  document.getElementById('progressSection').style.display = 'block';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('scoreGrid').innerHTML = '';
  document.getElementById('mainResultContent').innerHTML = '';

  setStep(1, 'active');

  const styleMap = {
    both: '장기투자와 단타/스윙 모두 고려하여 상황에 맞게',
    long: '장기투자 위주 (3개월~수년 보유)',
    swing: '스윙/단타 위주 (수일~수주 보유)'
  };

  const factorList = [...activeFactors].join(', ');
  const today = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });

  const systemPrompt = `당신은 월스트리트 출신 헤지펀드 매니저이자 퀀트 애널리스트입니다. 
미국 주식시장(나스닥, S&P500)을 전문으로 분석합니다.
오늘 날짜: ${today}

분석할 때 반드시 다음 구조로 답변하세요:

[SCORES]
시장_위험도: (0-100, 숫자만)
매수_타이밍: (매우좋음/좋음/보통/나쁨/매우나쁨)
전략: (장기/스윙/관망)
신뢰도: (높음/중간/낮음)
[/SCORES]

[분석]
## 🌍 현재 시장 환경
(거시경제, 금리, 지정학 리스크 상황 요약 — 구체적 수치와 날짜 포함)

## 📊 핵심 분석
(사용자 요청에 맞는 종목별/섹터별 심층 분석 — 펀더멘탈, 밸류에이션, 성장성)

## ⏱ 매수 타이밍 판단
(지금 당장 / 분할매수 시작 / 조정 기다려야 / 관망 — 이유와 함께 구체적으로)

## 🎯 추천 액션
(구체적 티커, 목표가, 손절선, 포지션 비중까지 가능하면 언급)

## ⚠️ 주요 리스크
(반드시 알아야 할 하방 리스크)
[/분석]

웹 검색으로 최신 정보를 최대한 활용하고, 추측이 아닌 근거 기반으로 분석하세요.`;

  const userMsg = `사용자 요청: ${query}

투자 스타일: ${styleMap[selectedStyle]}
분석 요소: ${factorList}

최신 뉴스와 시장 데이터를 검색하여 신중하고 깊이 있는 분석을 제공해주세요.`;

  try {
    // Step animation
    await sleep(600); setStep(2, 'active');
    await sleep(700); setStep(3, 'active');
    await sleep(700); setStep(4, 'active');
    await sleep(600); setStep(5, 'active');

    const res = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 3000,
        system: systemPrompt,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: 'user', content: userMsg }]
      })
    });

    const data = await res.json();

    // Extract text from all content blocks
    let fullText = '';
    if (data.content) {
      for (const block of data.content) {
        if (block.type === 'text') fullText += block.text;
      }
    }

    if (!fullText) {
      fullText = JSON.stringify(data);
    }

    // Parse scores
    const scoreMatch = fullText.match(/\[SCORES\]([\s\S]*?)\[\/SCORES\]/);
    let risk = 50, timing = '보통', strategy = '분석중', confidence = '중간';

    if (scoreMatch) {
      const s = scoreMatch[1];
      const riskM = s.match(/시장_위험도:\s*(\d+)/);
      const timingM = s.match(/매수_타이밍:\s*(\S+)/);
      const stratM = s.match(/전략:\s*(\S+)/);
      const confM = s.match(/신뢰도:\s*(\S+)/);
      if (riskM) risk = parseInt(riskM[1]);
      if (timingM) timing = timingM[1];
      if (stratM) strategy = stratM[1];
      if (confM) confidence = confM[1];
    }

    // Extract analysis part
    const analysisMatch = fullText.match(/\[분석\]([\s\S]*?)(\[\/분석\]|$)/);
    const analysisText = analysisMatch ? analysisMatch[1].trim() : fullText.replace(/\[SCORES\][\s\S]*?\[\/SCORES\]/, '').trim();

    // Show results
    document.getElementById('progressSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';

    // Score cards
    const riskClass = risk < 40 ? 'bull' : risk > 65 ? 'bear' : 'neutral';
    const timingClass = ['매우좋음','좋음'].includes(timing) ? 'bull' : ['나쁨','매우나쁨'].includes(timing) ? 'bear' : 'neutral';
    const stratClass = strategy.includes('장기') ? 'bull' : strategy.includes('관망') ? 'bear' : 'neutral';
    const confClass = confidence === '높음' ? 'bull' : confidence === '낮음' ? 'bear' : 'neutral';

    document.getElementById('scoreGrid').innerHTML = `
      <div class="score-card ${riskClass} fade-in">
        <div class="score-label">시장 위험도</div>
        <div class="score-value">${risk}</div>
        <div class="score-sub">/100 · ${risk<40?'낮음':risk>65?'높음':'중간'}</div>
      </div>
      <div class="score-card ${timingClass} fade-in">
        <div class="score-label">매수 타이밍</div>
        <div class="score-value" style="font-size:20px;padding-top:4px">${timing}</div>
        <div class="score-sub">현재 시점 평가</div>
      </div>
      <div class="score-card ${stratClass} fade-in">
        <div class="score-label">추천 전략</div>
        <div class="score-value" style="font-size:20px;padding-top:4px">${strategy}</div>
        <div class="score-sub">AI 판단</div>
      </div>
      <div class="score-card ${confClass} fade-in">
        <div class="score-label">분석 신뢰도</div>
        <div class="score-value" style="font-size:20px;padding-top:4px">${confidence}</div>
        <div class="score-sub">데이터 충분도</div>
      </div>
    `;

    // Stream analysis text
    const contentEl = document.getElementById('mainResultContent');
    contentEl.innerHTML = '';
    let i = 0;
    const speed = 12; // ms per char

    function streamChar() {
      if (i < analysisText.length) {
        const chunk = analysisText.slice(i, i + 3);
        contentEl.textContent += chunk;
        i += 3;
        setTimeout(streamChar, speed);
      }
    }
    streamChar();

    document.getElementById('resultSection').classList.add('fade-in');

  } catch (err) {
    document.getElementById('progressSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('mainResultContent').textContent = '오류가 발생했습니다: ' + err.message;
  }

  btn.disabled = false;
  btn.textContent = '▶ SIGNAL 분석 시작';
}
</script>
</body>
</html>
